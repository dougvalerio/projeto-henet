<div class="container" *ngIf="!isLoading; else loadingTemplate">
  <div class="carousel-slide" *ngIf="!showQrCodePopup">
    <swiper-container class="mySwiper" 
                     [pagination]="true" 
                     effect="coverflow" 
                     grab-cursor="true" 
                     centered-slides="true"
                     [slidesPerView]="'auto'"
                     [coverflowEffect]="{ rotate: 50, stretch: 0, depth: 100, modifier: 1, slideShadows: true }"
                     [autoplay]="{ delay: 2000, disableOnInteraction: false }">
      <swiper-slide *ngFor="let fotoBase64 of imagensCarregadas" lazy="true">
        <img [src]="fotoBase64" alt="Foto carregada" />
      </swiper-slide>
    </swiper-container>
  </div>
    
  <div class="qrcode" *ngIf="!showQrCodePopup">
    <p class="qrcode-text">Scaneie para baixar a primeira imagem.</p>
    <img [src]="qrCodeUrl" alt="QR Code">
  </div>

  <div class="logo-velejar" *ngIf="!showQrCodePopup">
    <p>Desenvolvido por: </p>
    <img src="../../../assets/logo-velejar.png" alt="">
  </div>

  <!-- Popup para exibir o QR code inicial -->
  <div *ngIf="showQrCodePopup" class="popup">
    <div class="popup-content">
      <button class="close-button" (click)="closeQrCodePopup()">✕</button>
      <h4>Leia o QR Code <br> antes de baixar a sua foto: </h4>
      <img [src]="qrCodeBut" alt="QR Code Inicial" class="qrcode-popup">
      <img [src]="logoUrl || '../../../assets/logo-velejar.png'" alt="logo henet" class="logo-henet-popup">
    </div>
  </div>
</div>

<ng-template #loadingTemplate>
  <div class="loading-container">
    <div class="spinner"></div>
    <p>Carregando imagens...</p>
  </div>
</ng-template>
