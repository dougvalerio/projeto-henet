<div class="container">
  <div class="carousel-slide">
    <swiper-container class="mySwiper" 
                  [pagination]="true" 
                  effect="coverflow" 
                  grab-cursor="true" 
                  centered-slides="true"
                  [slidesPerView]="'auto'"
                  [coverflowEffect]="{ rotate: 50, stretch: 0, depth: 100, modifier: 1, slideShadows: true }"
                  (slideChange)="onSlideChange($event)">
  
      <swiper-slide *ngFor="let videoBase64 of videosCarregados">
        <video [src]="videoBase64" type="video/mp4" muted playsinline loop></video>
      </swiper-slide>
  
    </swiper-container>
  </div>
    
  <div class="qrcode">
    <img [src]="qrCodeUrl" alt="QR Code">
  </div>

  <div class="logo-velejar">
    <p>Desenvolvido por: </p>
    <img src="../../../assets/logo-velejar.png" alt="">
  </div>

  <!-- Popup para exibir o QR code inicial -->
  <div *ngIf="showQrCodePopup" class="popup">
    <div class="popup-content">
      <button class="close-button" (click)="closeQrCodePopup()">✕</button>

      <h4>Leia o QR Code <br> antes de baixar o seu vídeo: </h4>
      <img [src]="qrCodeBut" alt="QR Code Inicial" class="qrcode-popup">
      <img [src]="logoUrl || '../../../assets/logo-velejar.png'" alt="logo henet" class="logo-henet-popup">
    </div>
  </div>
</div>
